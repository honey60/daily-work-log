<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef5f8">
  <title>今日工时 · 兼职记工</title>
  <link rel="icon" href="favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/work-log-icon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/work-log-icon-192.png?v=2">
  <link rel="shortcut icon" href="favicon.ico?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/work-log-icon-180.png">
  <link rel="manifest" href="manifest.webmanifest?v=2">
  <style>
    :root {
      color-scheme: light;
      --ink: #1d2830;
      --muted: #53636d;
      --accent: #477f9c;
      --accent-dark: #315f79;
      --paper: rgba(255, 255, 255, .44);
      --line: rgba(60, 91, 108, .16);
      --glass-border: rgba(255, 255, 255, .72);
      --shadow: 0 18px 45px rgba(42, 73, 89, .12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: #eff4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    body::before {
      position: fixed;
      z-index: -1;
      inset: 0;
      content: "";
      background-color: #eff4f6;
      background-image: linear-gradient(rgba(239, 246, 250, .62), rgba(239, 246, 250, .68)), url("default-background.png");
      background-position: center;
      background-size: cover;
      background-attachment: fixed;
    }
    body.has-background::before { background-image: linear-gradient(rgba(239, 246, 250, .52), rgba(239, 246, 250, .6)), var(--custom-background); }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .shell { width: min(1050px, calc(100% - 40px)); margin: 0 auto; padding: 44px 0 56px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 36px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { display: grid; width: 43px; height: 43px; place-items: center; border-radius: 14px; color: white; background: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .04em; white-space: nowrap; }
    .brand h1 { margin: 0; font-size: 18px; letter-spacing: .02em; }
    .brand p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    #background-file { display: none; }
    .settings-menu { position: relative; }
    .menu-trigger {
      display: grid; width: 42px; height: 42px; place-items: center; border: 1px solid var(--line);
      border-radius: 12px; color: var(--ink); background: rgba(255,255,255,.48); font-size: 24px; line-height: 1;
    }
    .menu-trigger:hover, .menu-trigger[aria-expanded="true"] { background: rgba(255,255,255,.82); }
    .menu-panel {
      position: absolute; z-index: 10; top: calc(100% + 8px); right: 0; display: grid; gap: 4px;
      min-width: 154px; padding: 6px; border: 1px solid var(--glass-border); border-radius: 12px;
      background: rgba(248,252,254,.88); box-shadow: 0 12px 30px rgba(42,73,89,.16);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    }
    .menu-panel[hidden] { display: none; }
    .menu-panel .menu-item {
      display: flex; width: 100%; min-height: 40px; align-items: center; justify-content: flex-start;
      padding: 0 10px; border: 0; border-radius: 8px; color: var(--ink); background: transparent;
      font-size: 13px; text-align: left; cursor: pointer;
    }
    .menu-panel .menu-item[hidden] { display: none; }
    .menu-panel .menu-item:hover { background: rgba(91,145,170,.12); }
    .intro { margin-bottom: 23px; }
    .eyebrow { margin: 0 0 9px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .14em; }
    .intro h2 { margin: 0; font-size: clamp(26px, 4vw, 36px); letter-spacing: -.04em; }
    .intro > p:last-child { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 19px; }
    .stat, .panel { border: 1px solid var(--glass-border); border-radius: 18px; background: var(--paper); box-shadow: var(--shadow); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); }
    .stat { min-height: 110px; padding: 19px 21px; text-align: center; }
    .stat-label { color: var(--muted); font-size: 12px; }
    .stat-value { margin-top: 10px; font-size: 27px; font-weight: 700; letter-spacing: -.04em; }
    .stat-value small { margin-left: 4px; color: var(--ink); font-size: 13px; font-weight: 700; letter-spacing: 0; }
    .content { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
    .panel { padding: 23px; }
    .panel-heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 21px; }
    .panel-heading h3 { margin: 0; font-size: 16px; }
    .panel-heading span { color: var(--muted); font-size: 12px; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 15px 12px; }
    .field { min-width: 0; }
    .field.date-field { grid-column: 1 / -1; }
    .field label { display: block; margin-bottom: 7px; color: #445660; font-size: 12px; font-weight: 600; }
    .field input[type="date"], .field input[type="time"] {
      width: 100%; height: 44px; padding: 0 11px; border: 1px solid var(--line); border-radius: 10px;
      outline: none; color: var(--ink); background: rgba(255,255,255,.28);
    }
    .field input[type="time"] {
      height: 50px; border-color: #8396a0; color: #17252d; background: #fff;
      color-scheme: light; font-size: 18px; font-weight: 650;
    }
    .field input:focus { border-color: #5790ad; box-shadow: 0 0 0 3px rgba(40,107,142,.12); }
    .meal-option {
      display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px;
      grid-column: 1 / -1;
      border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.24);
      color: #354751; font-size: 13px; cursor: pointer;
    }
    .meal-option input { width: 16px; height: 16px; accent-color: var(--accent); }
    .meal-option span { flex: 1; }
    .meal-option small { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .preview { display: flex; justify-content: space-between; gap: 12px; margin: 17px 0; padding: 13px 14px; border: 1px solid rgba(255,255,255,.52); border-radius: 11px; background: rgba(225,239,246,.38); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
    .preview div { display: grid; gap: 5px; }
    .preview span { color: var(--muted); font-size: 11px; }
    .preview strong { font-size: 15px; }
    .save-button { width: 100%; height: 46px; border-radius: 12px; font-weight: 650; }
    .save-button:hover { transform: translateY(-1px); }
    .save-button:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid rgba(40,107,142,.3); outline-offset: 2px; }
    .save-button, .auth-actions button, .signout-button, .settle-button {
      border: 1px solid rgba(255,255,255,.64); color: #fff;
      background: linear-gradient(135deg, rgba(93,153,179,.9), rgba(53,108,137,.91));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.38), 0 6px 16px rgba(46,94,118,.2);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      transition: background .2s, box-shadow .2s, transform .2s;
    }
    .save-button:hover, .auth-actions button:hover:not(:disabled), .signout-button:hover, .settle-button:hover:not(:disabled) {
      background: linear-gradient(135deg, rgba(79,139,166,.96), rgba(45,91,117,.96));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.42), 0 8px 18px rgba(46,94,118,.26);
      transform: translateY(-1px);
    }
    .message { min-height: 18px; margin: 10px 0 0; color: #a24035; font-size: 12px; }
    .auth-panel { max-width: 460px; margin: 0 auto 24px; padding: 22px; border: 1px solid var(--glass-border); border-radius: 18px; background: var(--paper); box-shadow: var(--shadow); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); }
    .auth-panel h2 { margin: 0 0 8px; font-size: 18px; }
    .auth-help { margin: 0 0 17px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .auth-fields { display: grid; gap: 12px; }
    .auth-fields label { display: grid; gap: 6px; color: #445660; font-size: 12px; font-weight: 600; }
    .auth-fields input { width: 100%; height: 44px; padding: 0 11px; border: 1px solid var(--line); border-radius: 10px; color: var(--ink); background: rgba(255,255,255,.4); }
    .auth-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 14px; }
    .auth-actions button, .signout-button { min-height: 42px; padding: 0 12px; border-radius: 11px; font-size: 13px; font-weight: 650; }
    .auth-actions button:disabled { cursor: not-allowed; opacity: .55; }
    #forgot-password-button { margin-top: 12px; padding: 0; border: 0; color: var(--accent); background: transparent; font-size: 12px; text-align: left; }
    #forgot-password-button:hover { text-decoration: underline; }
    .auth-message { min-height: 18px; margin: 12px 0 0; color: #a24035; font-size: 12px; line-height: 1.6; overflow-wrap: anywhere; }
    .account-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 20px; padding: 10px 13px; border: 1px solid var(--glass-border); border-radius: 12px; background: rgba(255,255,255,.42); box-shadow: 0 8px 24px rgba(42,73,89,.07); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
    .account-email { min-width: 0; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .account-actions { display: flex; flex: 0 0 auto; align-items: center; gap: 7px; }
    .backup-button { min-height: 34px; padding: 0 10px; border: 1px solid rgba(255,255,255,.72); border-radius: 10px; color: var(--accent-dark); background: rgba(255,255,255,.5); box-shadow: inset 0 1px 0 rgba(255,255,255,.65), 0 3px 10px rgba(42,73,89,.08); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); font-size: 12px; transition: background .2s, transform .2s, box-shadow .2s; }
    .backup-button:hover { background: rgba(255,255,255,.82); box-shadow: 0 5px 12px rgba(42,73,89,.12); transform: translateY(-1px); }
    .signout-button { flex: 0 0 auto; min-height: 34px; font-size: 12px; }
    .records { display: grid; gap: 10px; }
    .record { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
    .record:last-child { border-bottom: 0; }
    .record-main { min-width: 0; }
    .record-date { font-size: 13px; font-weight: 650; }
    .record-detail { margin-top: 6px; color: var(--muted); font-size: 11px; }
    .record-right { display: flex; align-items: center; gap: 12px; }
    .record-actions { position: relative; display: flex; align-items: center; }
    .record-menu-trigger { display: grid; width: 34px; height: 34px; place-items: center; border: 0; border-radius: 9px; color: var(--muted); background: transparent; font-size: 22px; line-height: 1; }
    .record-menu-trigger:hover, .record-menu-trigger[aria-expanded="true"] { color: var(--ink); background: rgba(255,255,255,.72); }
    .record-menu { position: absolute; z-index: 5; top: calc(100% + 5px); right: 0; display: grid; min-width: 112px; gap: 3px; padding: 5px; border: 1px solid var(--glass-border); border-radius: 10px; background: rgba(248,252,254,.9); box-shadow: 0 10px 25px rgba(42,73,89,.16); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .record-menu[hidden] { display: none; }
    .record-menu button { min-height: 36px; padding: 0 10px; border: 0; border-radius: 7px; color: var(--ink); background: transparent; font-size: 12px; text-align: left; }
    .record-menu button:hover { background: rgba(91,145,170,.12); }
    .record-menu .record-delete-action { color: #a24035; }
    .older-records { margin-top: 8px; border-top: 1px solid var(--line); }
    .older-records > summary { padding: 13px 0 3px; color: var(--accent); cursor: pointer; font-size: 12px; font-weight: 600; list-style: none; }
    .older-records > summary::-webkit-details-marker { display: none; }
    .older-records > summary::after { content: "+"; float: right; color: var(--muted); font-size: 16px; font-weight: 400; }
    .older-records[open] > summary::after { content: "−"; }
    .older-record-list { display: grid; gap: 4px; }
    .record-total { text-align: right; white-space: nowrap; }
    .record-total strong { display: block; font-size: 14px; }
    .record-total small { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
    .cancel-edit-button { width: 100%; min-height: 40px; margin-top: 8px; border: 1px solid rgba(255,255,255,.72); border-radius: 11px; color: var(--ink); background: rgba(255,255,255,.42); box-shadow: inset 0 1px 0 rgba(255,255,255,.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); transition: background .2s, transform .2s; }
    .cancel-edit-button:hover { background: rgba(255,255,255,.7); transform: translateY(-1px); }
    .empty { padding: 50px 10px; color: var(--muted); text-align: center; font-size: 13px; }
    .empty-icon { margin-bottom: 10px; font-size: 26px; }
    .footer { margin-top: 20px; color: var(--muted); text-align: center; font-size: 11px; }
    @media (max-width: 720px) {
      .shell { width: min(540px, calc(100% - 32px)); padding: 20px 0 30px; }
      header { margin-bottom: 25px; }
      .brand { gap: 10px; }
      .brand-mark { width: 40px; height: 40px; }
      .account-bar { align-items: center; flex-direction: row; gap: 8px; margin-bottom: 12px; padding: 7px 9px; }
      .account-email { max-width: 90px; overflow: hidden; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
      .account-actions { display: flex; gap: 5px; }
      .account-actions .backup-button, .account-actions .signout-button { min-height: 31px; padding: 0 7px; font-size: 10px; white-space: nowrap; }
      .intro { margin-bottom: 18px; }
      .eyebrow { margin-bottom: 6px; }
      .intro h2 { font-size: clamp(23px, 6.5vw, 28px); }
      .intro > p:last-child { margin-top: 8px; font-size: 13px; }
      .stats { gap: 8px; margin-bottom: 14px; }
      .stat, .panel { border-radius: 15px; }
      .stat { min-height: 84px; padding: 12px 9px; }
      .stat-label { font-size: 11px; }
      .stat-value { margin-top: 8px; font-size: 18px; }
      .stat-value small { margin-left: 2px; font-size: 11px; }
      .content { grid-template-columns: 1fr; }
      .content { gap: 14px; }
      .panel { padding: 18px; }
      .auth-panel { padding: 18px; border-radius: 15px; }
      .panel-heading { margin-bottom: 16px; }
      .fields { gap: 13px 10px; }
      .preview { margin: 14px 0; }
      .records { gap: 4px; }
      .record { align-items: flex-start; padding: 14px 0; }
      .record-right { gap: 7px; }
      .record-actions { margin-top: -3px; }
      .record-detail { line-height: 1.5; }
      .empty { padding: 26px 10px; }
      .footer { margin-top: 16px; line-height: 1.6; }
    }
    @media (max-width: 375px) {
      .brand p { font-size: 11px; }
      .background-button { padding: 0 10px; font-size: 12px; }
      .meal-option { gap: 6px; padding: 0 8px; }
      .meal-option small { font-size: 10px; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stat:first-child { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; gap: 14px; }
      .stat:first-child .stat-value { margin-top: 0; }
    }
    .cycle-bar {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 12px;
      margin: 22px 0 18px; padding: 14px 17px; border: 1px solid var(--glass-border);
      border-radius: 14px; background: var(--paper); box-shadow: var(--shadow);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    }
    .cycle-copy { grid-column: 1 / -1; }
    .cycle-copy strong { display: block; font-size: 13px; }
    .cycle-copy small { display: block; margin-top: 5px; color: var(--muted); font-size: 11px; }
    .settlement-date-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .settlement-date-fields label { display: grid; gap: 6px; color: #445660; font-size: 11px; font-weight: 600; }
    .settlement-date-fields input {
      width: 100%; min-width: 0; height: 40px; padding: 0 9px; border: 1px solid #8396a0;
      border-radius: 9px; outline: none; color: #17252d; background: #fff; color-scheme: light;
    }
    .settlement-date-fields input:focus { border-color: #5790ad; box-shadow: 0 0 0 3px rgba(40,107,142,.12); }
    .settlement-preview { grid-column: 1 / -1; min-height: 16px; margin: 0; color: var(--muted); font-size: 11px; }
    .settle-button {
      flex: 0 0 auto; min-height: 38px; padding: 0 13px; border: 0; border-radius: 10px;
      font-size: 12px; font-weight: 650;
    }
    .settle-button { border-radius: 11px; }
    .settle-button:disabled { cursor: not-allowed; color: #687984; background: rgba(226,234,238,.78); box-shadow: none; }
    .settlement-history {
      margin-top: 16px; overflow: hidden; border: 1px solid var(--glass-border);
      border-radius: 15px; background: var(--paper); box-shadow: var(--shadow);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    }
    .settlement-history > summary {
      display: flex; align-items: center; justify-content: space-between; min-height: 52px;
      padding: 0 18px; cursor: pointer; font-size: 13px; font-weight: 650; list-style: none;
    }
    .settlement-history > summary::-webkit-details-marker { display: none; }
    .settlement-history > summary::after { content: "+"; margin-left: auto; padding-left: 10px; color: var(--muted); font-size: 17px; }
    .settlement-history[open] > summary::after { content: "−"; }
    .settlement-history > summary small { margin-left: 8px; color: var(--muted); font-size: 11px; font-weight: 400; }
    .settlement-list { padding: 0 18px 12px; }
    .settlement { padding: 12px 0; border-top: 1px solid var(--line); }
    .settlement > summary { display: flex; justify-content: space-between; gap: 12px; cursor: pointer; list-style: none; }
    .settlement > summary::-webkit-details-marker { display: none; }
    .settlement-period { font-size: 12px; font-weight: 650; }
    .settlement-meta { margin-top: 5px; color: var(--muted); font-size: 11px; }
    .settlement-pay { white-space: nowrap; font-size: 13px; font-weight: 700; }
    .settlement .record { padding: 10px 0; }
    .settlement .delete-button { display: none; }
    .settlement-empty { padding: 16px 0 8px; color: var(--muted); font-size: 12px; }
    @media (max-width: 720px) {
      .cycle-bar { grid-template-columns: 1fr; margin-bottom: 14px; padding: 13px; }
      .settle-button { width: 100%; }
      .cycle-copy small { max-width: 190px; line-height: 1.5; }
      .settle-button { min-height: 40px; }
      .settlement-history { margin-top: 14px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">
        <div class="brand-mark" aria-label="吴蕴涵">吴蕴涵</div>
        <div><h1>今日工时</h1><p>认真记录每一份付出</p></div>
      </div>
      <div class="settings-menu">
        <button class="menu-trigger" id="menu-trigger" type="button" aria-label="更多设置" aria-expanded="false" aria-controls="background-menu">⋯</button>
        <div class="menu-panel" id="background-menu" hidden>
          <label class="menu-item" for="background-file">更换背景</label>
          <input id="background-file" type="file" accept="image/*" aria-label="上传自定义背景图片">
          <button class="menu-item" id="reset-background" type="button" hidden>恢复默认背景</button>
        </div>
      </div>
    </header>

    <section class="auth-panel" id="auth-panel">
      <h2>登录后同步保存</h2>
      <p class="auth-help">使用同一个账号，可在手机和电脑查看同一份工时记录。此浏览器会保持登录状态；退出登录或清理浏览器数据后需要重新登录。</p>
      <form id="auth-form">
        <div class="auth-fields">
          <label for="auth-email">邮箱<input id="auth-email" type="email" autocomplete="email" required></label>
          <label for="auth-password">密码<input id="auth-password" type="password" autocomplete="current-password" minlength="8" required></label>
        </div>
        <div class="auth-actions">
          <button type="submit" id="sign-in-button">登录</button>
          <button type="button" id="sign-up-button">注册新账号</button>
        </div>
      </form>
      <button class="menu-item" id="forgot-password-button" type="button">忘记密码？发送重置邮件</button>
      <form id="password-reset-form" hidden>
        <div class="auth-fields">
          <label for="new-password">新密码<input id="new-password" type="password" autocomplete="new-password" minlength="8" required></label>
          <label for="confirm-password">确认新密码<input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required></label>
        </div>
        <div class="auth-actions">
          <button type="submit" id="update-password-button">保存新密码</button>
          <button type="button" id="cancel-password-reset-button">返回登录</button>
        </div>
      </form>
      <p class="auth-message" id="auth-message" role="status"></p>
    </section>

    <div id="app-content" hidden>
    <div class="account-bar">
      <span class="account-email" id="account-email"></span>
      <div class="account-actions">
        <button class="backup-button" id="export-backup-button" type="button">下载备份</button>
        <button class="backup-button" id="import-backup-button" type="button">恢复备份</button>
        <input id="backup-file" type="file" accept="application/json,.json" hidden>
        <button class="signout-button" id="sign-out-button" type="button">退出登录</button>
      </div>
    </div>
    <section class="intro">
      <p class="eyebrow">WORK LOG</p>
      <h2>把每一小时，都记下来。</h2>
      <p>记录上下班时间，工时和工资自动为你算好。</p>
    </section>

    <section class="stats" aria-label="累计统计">
      <article class="stat"><div class="stat-label">累计工时</div><div class="stat-value" id="total-hours">0小时<small>0分钟</small></div></article>
      <article class="stat"><div class="stat-label">累计工资</div><div class="stat-value" id="total-pay">¥0.00</div></article>
      <article class="stat"><div class="stat-label">记录天数</div><div class="stat-value" id="total-days">0<small>天</small></div></article>
    </section>

    <div class="content">
      <section class="panel">
        <div class="panel-heading"><h3 id="form-heading">记一笔工时</h3><span>时薪 ¥15 / 小时</span></div>
        <form id="work-form" novalidate>
          <div class="fields">
            <div class="field date-field"><label for="work-date">工作日期</label><input id="work-date" name="date" type="date" required></div>
            <div class="field"><label for="start-time">上班时间</label><input id="start-time" name="start" type="time" step="60" title="点按后使用手机系统的时间选择器" required></div>
            <div class="field"><label for="end-time">下班时间</label><input id="end-time" name="end" type="time" step="60" title="点按后使用手机系统的时间选择器" required></div>
            <label class="meal-option" for="meal">
              <input id="meal" name="meal" type="checkbox">
              <span>今天吃饭了</span>
              <small>扣 30 分钟</small>
            </label>
          </div>
          <div class="preview" aria-live="polite">
            <div><span>今日净工时</span><strong id="preview-hours">—</strong></div>
            <div><span>预计工资</span><strong id="preview-pay">—</strong></div>
          </div>
          <button class="save-button" type="submit">保存今日记录</button>
          <button class="cancel-edit-button" id="cancel-edit-button" type="button" hidden>取消编辑</button>
          <p class="message" id="form-message" role="status"></p>
        </form>
      </section>

      <section class="panel">
        <div class="panel-heading"><h3>工时记录</h3><span id="record-count">共 0 条</span></div>
        <div class="records" id="records"></div>
      </section>
    </div>
    <section class="cycle-bar" aria-label="选择结算周期">
      <div class="cycle-copy"><strong>选择结算周期</strong><small>只结算所选日期范围内的记录，范围外记录会保留</small></div>
      <div class="settlement-date-fields">
        <label for="settlement-start-date">开始日期<input id="settlement-start-date" type="date"></label>
        <label for="settlement-end-date">结束日期<input id="settlement-end-date" type="date"></label>
      </div>
      <p class="settlement-preview" id="settlement-preview" aria-live="polite"></p>
      <button class="settle-button" id="settle-button" type="button" disabled>结算所选周期</button>
    </section>
    <details class="settlement-history">
      <summary><span>历史结算</span><small id="settlement-count">0 期</small></summary>
      <div class="settlement-list" id="settlement-list"></div>
    </details>
    <footer class="footer">工时按实际时长计算 · 用餐扣除 30 分钟 · 登录后记录保存在云端</footer>
    </div>
  </main>

  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (() => {
      const HOURLY_RATE = 15;
      const STORAGE_KEY = "daily-work-data-v2";
      const LEGACY_STORAGE_KEY = "daily-work-records-v1";
      const BACKGROUND_DB = "daily-work-background-v1";
      const SUPABASE_CONFIG = window.WORK_LOG_SUPABASE_CONFIG || {};
      const SUPABASE_URL = SUPABASE_CONFIG.url;
      const SUPABASE_ANON_KEY = SUPABASE_CONFIG.anonKey || "";
      const CLOUD_TABLE = "work_log_data";
      const form = document.querySelector("#work-form");
      const dateInput = document.querySelector("#work-date");
      const startInput = document.querySelector("#start-time");
      const endInput = document.querySelector("#end-time");
      const mealInput = document.querySelector("#meal");
      const settlementStartDateInput = document.querySelector("#settlement-start-date");
      const settlementEndDateInput = document.querySelector("#settlement-end-date");
      const settlementPreview = document.querySelector("#settlement-preview");
      const settleButton = document.querySelector("#settle-button");
      const recordsElement = document.querySelector("#records");
      const messageElement = document.querySelector("#form-message");
      const saveButton = form.querySelector(".save-button");
      const cancelEditButton = document.querySelector("#cancel-edit-button");
      const exportBackupButton = document.querySelector("#export-backup-button");
      const importBackupButton = document.querySelector("#import-backup-button");
      const backupFileInput = document.querySelector("#backup-file");
      let editingDate = null;
      const authPanel = document.querySelector("#auth-panel");
      const authMessage = document.querySelector("#auth-message");
      const appContent = document.querySelector("#app-content");
      const authForm = document.querySelector("#auth-form");
      const signInButton = document.querySelector("#sign-in-button");
      const signUpButton = document.querySelector("#sign-up-button");
      const forgotPasswordButton = document.querySelector("#forgot-password-button");
      const passwordResetForm = document.querySelector("#password-reset-form");
      const updatePasswordButton = document.querySelector("#update-password-button");
      let recoveryMode = window.location.hash.includes("type=recovery");
      let recoveredUser = null;
      const isConfigured = Boolean(SUPABASE_URL && SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.startsWith("PASTE_"));
      const supabase = isConfigured && window.supabase
        ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: true }
        })
        : null;
      let currentUser = null;
      let loadingUserId = null;
      let settlementRangeManuallyChanged = false;

      const today = new Date();
      dateInput.value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;

      function readData() {
        try {
          const savedData = localStorage.getItem(STORAGE_KEY);
          if (savedData) {
            const data = JSON.parse(savedData);
            if (!Array.isArray(data.records) || !Array.isArray(data.settlements)) throw new Error("工时数据格式不正确。");
            return data;
          }
          const legacyRecords = JSON.parse(localStorage.getItem(LEGACY_STORAGE_KEY) || "[]");
          if (!Array.isArray(legacyRecords)) throw new Error("旧版工时记录格式不正确。");
          return { records: legacyRecords, settlements: [] };
        } catch (error) {
          authMessage.textContent = `读取本机旧记录失败：${error.message}`;
          return { records: [], settlements: [] };
        }
      }

      let { records, settlements } = readData();

      function formatDuration(minutes) {
        const hours = Math.floor(minutes / 60);
        const remainder = minutes % 60;
        return `${hours}小时${remainder}分钟`;
      }

      function shiftMinutes(start, end, meal) {
        const [startHour, startMinute] = start.split(":").map(Number);
        const [endHour, endMinute] = end.split(":").map(Number);
        let duration = endHour * 60 + endMinute - (startHour * 60 + startMinute);
        if (duration < 0) duration += 24 * 60;
        return duration - (meal ? 30 : 0);
      }

      function calculate() {
        if (!startInput.value || !endInput.value) return null;
        const gross = shiftMinutes(startInput.value, endInput.value, false);
        if (gross === 0) return null;
        return Math.max(0, gross - (mealInput.checked ? 30 : 0));
      }

      function updatePreview() {
        const minutes = calculate();
        document.querySelector("#preview-hours").textContent = minutes === null ? "—" : formatDuration(minutes);
        document.querySelector("#preview-pay").textContent = minutes === null ? "—" : `¥${(minutes / 60 * HOURLY_RATE).toFixed(2)}`;
      }

      function formatDate(date) {
        const [year, month, day] = date.split("-");
        return `${year}年${Number(month)}月${Number(day)}日`;
      }

      function localDateString(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      }

      function updateSettlementSelection() {
        const start = settlementStartDateInput.value;
        const end = settlementEndDateInput.value;
        const validRange = Boolean(start && end && start <= end);
        const selectedRecords = validRange
          ? records.filter((record) => record.date >= start && record.date <= end)
          : [];
        const totalMinutes = selectedRecords.reduce((sum, record) => sum + record.minutes, 0);

        if (!start || !end) {
          settlementPreview.textContent = "请选择开始和结束日期。";
        } else if (start > end) {
          settlementPreview.textContent = "结束日期不能早于开始日期。";
        } else if (selectedRecords.length === 0) {
          settlementPreview.textContent = "所选日期范围内没有工时记录。";
        } else {
          settlementPreview.textContent = `所选范围 ${selectedRecords.length} 天 · ${formatDuration(totalMinutes)} · 预计工资 ¥${(totalMinutes / 60 * HOURLY_RATE).toFixed(2)}`;
        }
        settleButton.disabled = selectedRecords.length === 0;
        return selectedRecords;
      }

      function setDefaultSettlementRange() {
        if (settlementRangeManuallyChanged) return;
        const sortedDates = records.map((record) => record.date).sort();
        const todayDate = localDateString(today);
        settlementStartDateInput.value = sortedDates[0] || todayDate;
        settlementEndDateInput.value = sortedDates[sortedDates.length - 1] || todayDate;
      }

      function clearEditing() {
        editingDate = null;
        form.reset();
        dateInput.value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;
        document.querySelector("#form-heading").textContent = "记一笔工时";
        saveButton.textContent = "保存今日记录";
        cancelEditButton.hidden = true;
        updatePreview();
      }

      function editRecord(record) {
        editingDate = record.date;
        dateInput.value = record.date;
        startInput.value = record.start;
        endInput.value = record.end;
        mealInput.checked = record.meal;
        document.querySelector("#form-heading").textContent = `编辑 ${formatDate(record.date)}`;
        saveButton.textContent = "保存修改";
        cancelEditButton.hidden = false;
        messageElement.textContent = "";
        updatePreview();
        form.scrollIntoView({ behavior: "smooth", block: "center" });
        dateInput.focus({ preventScroll: true });
      }

      function createRecordRow(record, allowDelete) {
        const row = document.createElement("article");
        row.className = "record";
        const main = document.createElement("div");
        main.className = "record-main";
        const day = document.createElement("div");
        day.className = "record-date";
        day.textContent = formatDate(record.date);
        const detail = document.createElement("div");
        detail.className = "record-detail";
        detail.textContent = `${record.start} — ${record.end}${record.end < record.start ? "（次日）" : ""} · ${record.meal ? "已用餐，扣30分钟" : "未用餐"}`;
        main.append(day, detail);

        const right = document.createElement("div");
        right.className = "record-right";
        const total = document.createElement("div");
        total.className = "record-total";
        const hours = document.createElement("strong");
        hours.textContent = formatDuration(record.minutes);
        const pay = document.createElement("small");
        pay.textContent = `¥${(record.minutes / 60 * HOURLY_RATE).toFixed(2)}`;
        total.append(hours, pay);
        right.append(total);

        if (allowDelete) {
          const actions = document.createElement("div");
          actions.className = "record-actions";
          const menuTrigger = document.createElement("button");
          menuTrigger.className = "record-menu-trigger";
          menuTrigger.type = "button";
          menuTrigger.textContent = "⋯";
          menuTrigger.setAttribute("aria-label", `${formatDate(record.date)}的更多操作`);
          menuTrigger.setAttribute("aria-expanded", "false");
          const menu = document.createElement("div");
          menu.className = "record-menu";
          menu.hidden = true;

          const edit = document.createElement("button");
          edit.type = "button";
          edit.textContent = "编辑";
          edit.addEventListener("click", () => {
            menu.hidden = true;
            menuTrigger.setAttribute("aria-expanded", "false");
            editRecord(record);
          });

          const remove = document.createElement("button");
          remove.className = "record-delete-action";
          remove.type = "button";
          remove.textContent = "删除";
          remove.addEventListener("click", async () => {
            menu.hidden = true;
            menuTrigger.setAttribute("aria-expanded", "false");
            if (await saveRecords(records.filter((item) => item.date !== record.date)) && editingDate === record.date) {
              clearEditing();
            }
          });

          menu.append(edit, remove);
          menuTrigger.addEventListener("click", () => {
            const isOpening = menu.hidden;
            recordsElement.querySelectorAll(".record-menu").forEach((item) => { item.hidden = true; });
            recordsElement.querySelectorAll(".record-menu-trigger").forEach((item) => item.setAttribute("aria-expanded", "false"));
            menu.hidden = !isOpening;
            menuTrigger.setAttribute("aria-expanded", String(isOpening));
          });
          actions.append(menuTrigger, menu);
          right.append(actions);
        }

        row.append(main, right);
        return row;
      }

      function renderSettlements() {
        const list = document.querySelector("#settlement-list");
        document.querySelector("#settlement-count").textContent = `${settlements.length} 期`;
        list.replaceChildren();
        if (settlements.length === 0) {
          const empty = document.createElement("div");
          empty.className = "settlement-empty";
          empty.textContent = "结算后的工时记录会保存在这里。";
          list.append(empty);
          return;
        }

        settlements.forEach((settlement) => {
          const period = document.createElement("details");
          period.className = "settlement";
          const summary = document.createElement("summary");
          const info = document.createElement("div");
          const dates = settlement.records.map((record) => record.date).sort();
          const startDate = dates[0];
          const endDate = dates[dates.length - 1];
          const range = document.createElement("div");
          range.className = "settlement-period";
          const periodStart = settlement.periodStart || startDate;
          const periodEnd = settlement.periodEnd || endDate;
          range.textContent = periodStart === periodEnd ? formatDate(periodStart) : `${formatDate(periodStart)} — ${formatDate(periodEnd)}`;
          const meta = document.createElement("div");
          meta.className = "settlement-meta";
          meta.textContent = `${settlement.records.length} 天 · ${formatDuration(settlement.minutes)} · 结算于 ${formatDate(settlement.settledAt)}`;
          info.append(range, meta);
          const pay = document.createElement("div");
          pay.className = "settlement-pay";
          pay.textContent = `¥${(settlement.minutes / 60 * HOURLY_RATE).toFixed(2)}`;
          summary.append(info, pay);
          period.append(summary);
          settlement.records.slice().sort((a, b) => b.date.localeCompare(a.date)).forEach((record) => {
            period.append(createRecordRow(record, false));
          });
          list.append(period);
        });
      }

      function render() {
        records.sort((a, b) => b.date.localeCompare(a.date));
        const totalMinutes = records.reduce((sum, record) => sum + record.minutes, 0);
        const totalHours = document.querySelector("#total-hours");
        totalHours.replaceChildren(document.createTextNode(`${Math.floor(totalMinutes / 60)}小时`));
        if (totalMinutes % 60 !== 0) {
          const remainder = document.createElement("small");
          remainder.textContent = `${totalMinutes % 60}分钟`;
          totalHours.append(remainder);
        }
        document.querySelector("#total-pay").textContent = `¥${(totalMinutes / 60 * HOURLY_RATE).toFixed(2)}`;
        document.querySelector("#total-days").innerHTML = `${records.length}<small>天</small>`;
        document.querySelector("#record-count").textContent = `共 ${records.length} 条`;
        setDefaultSettlementRange();
        updateSettlementSelection();
        recordsElement.replaceChildren();
        renderSettlements();

        if (records.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.innerHTML = '<div class="empty-icon" aria-hidden="true">☀</div><div>还没有工时记录<br>保存后会显示在这里</div>';
          recordsElement.append(empty);
          return;
        }

        records.slice(0, 5).forEach((record) => {
          recordsElement.append(createRecordRow(record, true));
        });
        if (records.length > 5) {
          const olderRecords = document.createElement("details");
          olderRecords.className = "older-records";
          const summary = document.createElement("summary");
          summary.textContent = `更早记录（${records.length - 5} 条）`;
          const olderList = document.createElement("div");
          olderList.className = "older-record-list";
          records.slice(5).forEach((record) => olderList.append(createRecordRow(record, true)));
          olderRecords.append(summary, olderList);
          recordsElement.append(olderRecords);
        }
      }

      function cacheData(nextRecords, nextSettlements) {
        try {
          const serialized = JSON.stringify({ records: nextRecords, settlements: nextSettlements });
          localStorage.setItem(STORAGE_KEY, serialized);
          if (currentUser) localStorage.setItem(`${STORAGE_KEY}-${currentUser.id}`, serialized);
        } catch (error) {
          messageElement.textContent = `云端已保存，但本机缓存失败：${error.message}`;
        }
      }

      function normalizedData(data) {
        return {
          records: data.records.slice().sort((a, b) => a.date.localeCompare(b.date)),
          settlements: data.settlements.slice().sort((a, b) => JSON.stringify(a).localeCompare(JSON.stringify(b)))
        };
      }

      function dataFingerprint(data) {
        return JSON.stringify(normalizedData(data));
      }

      function exportBackup() {
        if (!currentUser) {
          messageElement.textContent = "请先登录后下载备份。";
          return;
        }
        const backup = {
          format: "daily-work-log-backup",
          version: 1,
          exportedAt: new Date().toISOString(),
          email: currentUser.email || null,
          records,
          settlements
        };
        const url = URL.createObjectURL(new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" }));
        const link = document.createElement("a");
        link.href = url;
        link.download = `work-log-backup-${new Date().toISOString().slice(0, 10)}.json`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        messageElement.textContent = "备份文件已下载，请保存到安全的位置。";
      }

      function isValidRecord(record) {
        return record
          && /^\d{4}-\d{2}-\d{2}$/.test(record.date)
          && /^\d{2}:\d{2}$/.test(record.start)
          && /^\d{2}:\d{2}$/.test(record.end)
          && typeof record.meal === "boolean"
          && Number.isFinite(record.minutes)
          && record.minutes >= 0;
      }

      function isValidSettlement(settlement) {
        return settlement
          && /^\d{4}-\d{2}-\d{2}$/.test(settlement.settledAt)
          && Number.isFinite(settlement.minutes)
          && settlement.minutes >= 0
          && Array.isArray(settlement.records)
          && settlement.records.every(isValidRecord)
          && ((settlement.periodStart === undefined && settlement.periodEnd === undefined)
            || (/^\d{4}-\d{2}-\d{2}$/.test(settlement.periodStart)
              && /^\d{4}-\d{2}-\d{2}$/.test(settlement.periodEnd)
              && settlement.periodStart <= settlement.periodEnd));
      }

      async function restoreBackup(file) {
        if (!currentUser) {
          messageElement.textContent = "请先登录后恢复备份。";
          return;
        }
        try {
          const backup = JSON.parse(await file.text());
          if (backup.format !== "daily-work-log-backup" || backup.version !== 1
            || !Array.isArray(backup.records) || !backup.records.every(isValidRecord)
            || !Array.isArray(backup.settlements) || !backup.settlements.every(isValidSettlement)) {
            throw new Error("文件格式不正确或备份版本不支持。");
          }
          const nextRecords = new Map(records.map((record) => [record.date, record]));
          backup.records.forEach((record) => nextRecords.set(record.date, record));
          const nextSettlements = new Map(settlements.map((settlement) => [JSON.stringify(settlement), settlement]));
          backup.settlements.forEach((settlement) => nextSettlements.set(JSON.stringify(settlement), settlement));
          const mergedRecords = Array.from(nextRecords.values());
          const mergedSettlements = Array.from(nextSettlements.values());
          if (!window.confirm(`将备份中的 ${backup.records.length} 条记录和 ${backup.settlements.length} 期结算合并到当前云端数据。相同日期将以备份为准；当前数据不会被整份覆盖。继续吗？`)) return;
          if (await saveRecords(mergedRecords, mergedSettlements)) {
            messageElement.textContent = "备份已合并并保存到云端。";
          }
        } catch (error) {
          messageElement.textContent = `恢复备份失败：${error.message}`;
        } finally {
          backupFileInput.value = "";
        }
      }

      function recordFromLegacyRow(row) {
        if (!row.start_time || !row.end_time) return null;
        const start = new Date(row.start_time);
        const end = new Date(row.end_time);
        if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime())) return null;
        let minutes = Math.round((end.getTime() - start.getTime()) / 60000);
        if (minutes <= 0) minutes += 24 * 60;
        const meal = /meal|用餐|吃饭/i.test(row.remark || "");
        if (meal) minutes = Math.max(0, minutes - 30);
        const localDate = `${start.getFullYear()}-${String(start.getMonth() + 1).padStart(2, "0")}-${String(start.getDate()).padStart(2, "0")}`;
        const localTime = (date) => `${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
        return { date: localDate, start: localTime(start), end: localTime(end), meal, minutes };
      }

      async function saveRecords(nextRecords, nextSettlements = settlements) {
        if (!supabase || !currentUser) {
          messageElement.textContent = "请先登录，记录才能保存到云端。";
          return false;
        }
        const payload = { records: nextRecords, settlements: nextSettlements };
        try {
          const row = {
            user_id: currentUser.id,
            payload,
            updated_at: new Date().toISOString()
          };
          const { data, error } = await supabase
            .from(CLOUD_TABLE)
            .update(row)
            .eq("user_id", currentUser.id)
            .select("id");
          if (error) throw error;
          if (data.length === 0) {
            const { error: insertError } = await supabase.from(CLOUD_TABLE).insert(row);
            if (insertError) throw insertError;
          }
        } catch (error) {
          messageElement.textContent = `云端保存失败：${error.message}`;
          return false;
        }
        records = nextRecords;
        settlements = nextSettlements;
        cacheData(records, settlements);
        if (!messageElement.textContent.startsWith("云端已保存")) messageElement.textContent = "";
        render();
        return true;
      }

      function showSignedOut(message = "") {
        currentUser = null;
        loadingUserId = null;
        appContent.hidden = true;
        authPanel.hidden = false;
        authForm.hidden = false;
        passwordResetForm.hidden = true;
        forgotPasswordButton.hidden = false;
        authMessage.textContent = message;
        if (supabase) {
          signInButton.disabled = false;
          signUpButton.disabled = false;
        }
      }

      async function loadCloudData(user) {
        if (!supabase || loadingUserId === user.id) return;
        loadingUserId = user.id;
        currentUser = user;
        authMessage.textContent = "正在读取云端记录…";
        signInButton.disabled = true;
        signUpButton.disabled = true;
        try {
          const localData = readData();
          const { data, error } = await supabase
            .from(CLOUD_TABLE)
            .select("payload,updated_at,start_time,end_time,remark")
            .eq("user_id", user.id)
            .order("updated_at", { ascending: true });
          if (error) throw error;

          if (data.length > 0) {
            const cloudRecords = new Map();
            const cloudSettlements = new Map();
            let importedLegacyRecords = false;
            data.forEach((row) => {
              const legacyRecord = recordFromLegacyRow(row);
              if (legacyRecord) {
                cloudRecords.set(legacyRecord.date, legacyRecord);
                importedLegacyRecords = true;
              }
            });
            data.forEach((row) => {
              const cloudData = row.payload;
              if (!cloudData || !Array.isArray(cloudData.records) || !Array.isArray(cloudData.settlements)) {
                throw new Error("云端数据格式不正确，原有数据未修改。");
              }
              cloudData.records.forEach((record) => cloudRecords.set(record.date, record));
              cloudData.settlements.forEach((settlement) => cloudSettlements.set(JSON.stringify(settlement), settlement));
            });
            const cloudData = {
              records: Array.from(cloudRecords.values()),
              settlements: Array.from(cloudSettlements.values())
            };
            if (!Array.isArray(cloudData.records) || !Array.isArray(cloudData.settlements)) {
              throw new Error("云端数据格式不正确，原有数据未修改。");
            }
            const hasLocalData = localData.records.length > 0 || localData.settlements.length > 0;
            if (hasLocalData && dataFingerprint(localData) !== dataFingerprint(cloudData)
              && window.confirm("这台设备还有不同于云端的本机记录。确定将本机记录合并到云端吗？同一天的记录以云端为准。")) {
              const mergedRecords = new Map(localData.records.map((record) => [record.date, record]));
              cloudData.records.forEach((record) => mergedRecords.set(record.date, record));
              const settlementMap = new Map();
              [...localData.settlements, ...cloudData.settlements].forEach((settlement) => {
                settlementMap.set(JSON.stringify(settlement), settlement);
              });
              records = Array.from(mergedRecords.values());
              settlements = Array.from(settlementMap.values());
              if (!await saveRecords(records, settlements)) throw new Error(messageElement.textContent);
            } else {
              records = cloudData.records;
              settlements = cloudData.settlements;
            }
            if (importedLegacyRecords && !await saveRecords(records, settlements)) {
              throw new Error(messageElement.textContent);
            }
          } else {
            records = localData.records;
            settlements = localData.settlements;
            const { error: saveError } = await supabase.from(CLOUD_TABLE).upsert({
              user_id: user.id,
              payload: { records, settlements },
              updated_at: new Date().toISOString()
            });
            if (saveError) throw saveError;
          }

          cacheData(records, settlements);
          currentUser = user;
          document.querySelector("#account-email").textContent = `已同步：${user.email || "当前账号"}`;
          authPanel.hidden = true;
          appContent.hidden = false;
          authMessage.textContent = "";
          messageElement.textContent = "";
          render();
        } catch (error) {
          const message = String(error.message || "");
          if (message.includes("multiple (or no) rows returned")) {
            showSignedOut("当前页面仍收到旧版的单行查询错误。请用带 ?refresh=1 的网站链接重新打开；不要删除数据库记录。");
          } else if (message.includes("work_log_data.payload") || message.includes("column payload")) {
            showSignedOut("数据库缺少 payload 字段。请在 Supabase SQL Editor 重新运行项目中的 supabase-schema.sql，再刷新本页登录。原有记录未删除。");
          } else {
            const code = error.code ? ` (${error.code})` : "";
            showSignedOut(`读取云端失败：${message}${code}`);
          }
        }
      }

      async function submitAuth(mode) {
        if (!supabase) {
          authMessage.textContent = isConfigured
            ? "Supabase 客户端加载失败，请检查网络后刷新页面。"
            : "请先在 supabase-config.js 中填入 Supabase 的公开 anon/publishable key，再发布页面。";
          return;
        }
        const email = document.querySelector("#auth-email").value.trim();
        const password = document.querySelector("#auth-password").value;
        authMessage.textContent = mode === "signup" ? "正在创建账号…" : "正在登录…";
        signInButton.disabled = true;
        signUpButton.disabled = true;
        const result = mode === "signup"
          ? await supabase.auth.signUp({
            email,
            password,
            options: { emailRedirectTo: `${window.location.origin}${window.location.pathname}` }
          })
          : await supabase.auth.signInWithPassword({ email, password });
        if (result.error) {
          authMessage.textContent = result.error.message === "Invalid login credentials"
            ? "邮箱或密码不正确。请检查填写，或点“忘记密码”重设密码。"
            : `账号操作失败：${result.error.message}`;
          signInButton.disabled = false;
          signUpButton.disabled = false;
        } else if (mode === "signup" && !result.data.session) {
          authMessage.textContent = "注册成功。请先到邮箱查收验证邮件，完成验证后再登录。";
          signInButton.disabled = false;
          signUpButton.disabled = false;
        } else if (result.data.session) {
          await loadCloudData(result.data.session.user);
        }
      }

      function showPasswordReset() {
        recoveryMode = true;
        authPanel.hidden = false;
        appContent.hidden = true;
        authForm.hidden = true;
        forgotPasswordButton.hidden = true;
        passwordResetForm.hidden = false;
        authMessage.textContent = "请设置至少 8 位的新密码。";
      }

      forgotPasswordButton.addEventListener("click", async () => {
        if (!supabase) return;
        const emailInput = document.querySelector("#auth-email");
        const email = emailInput.value.trim();
        if (!emailInput.value || !emailInput.validity.valid) {
          authMessage.textContent = "请先填写有效邮箱，再发送重置邮件。";
          emailInput.focus();
          return;
        }
        forgotPasswordButton.disabled = true;
        authMessage.textContent = "正在发送密码重置邮件…";
        try {
          const { error } = await supabase.auth.resetPasswordForEmail(email, {
            redirectTo: `${window.location.origin}${window.location.pathname}`
          });
          if (error) throw error;
          authMessage.textContent = "如果该邮箱已注册，请查收密码重置邮件，并在此设备打开邮件链接。";
        } catch (error) {
          authMessage.textContent = `发送重置邮件失败：${error.message}`;
        } finally {
          forgotPasswordButton.disabled = false;
        }
      });

      passwordResetForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const password = document.querySelector("#new-password").value;
        const confirmation = document.querySelector("#confirm-password").value;
        if (password !== confirmation) {
          authMessage.textContent = "两次输入的新密码不一致。";
          return;
        }
        if (!supabase || !recoveredUser) {
          authMessage.textContent = "重置链接无效或已过期，请重新发送重置邮件。";
          return;
        }
        updatePasswordButton.disabled = true;
        authMessage.textContent = "正在更新密码…";
        try {
          const { data, error } = await supabase.auth.updateUser({ password });
          if (error) throw error;
          recoveryMode = false;
          authMessage.textContent = "密码已更新，正在加载记录…";
          await loadCloudData(data.user || recoveredUser);
        } catch (error) {
          authMessage.textContent = `更新密码失败：${error.message}`;
        } finally {
          updatePasswordButton.disabled = false;
        }
      });

      document.querySelector("#cancel-password-reset-button").addEventListener("click", () => {
        recoveryMode = false;
        recoveredUser = null;
        passwordResetForm.reset();
        supabase.auth.signOut().then(({ error }) => {
          showSignedOut(error ? `退出重置流程失败：${error.message}` : "");
        }).catch((error) => showSignedOut(`退出重置流程失败：${error.message}`));
      });

      authForm.addEventListener("submit", (event) => {
        event.preventDefault();
        submitAuth("signin").catch((error) => {
          authMessage.textContent = `登录失败：${error.message}`;
          signInButton.disabled = false;
          signUpButton.disabled = false;
        });
      });
      signUpButton.addEventListener("click", () => {
        if (!authForm.reportValidity()) return;
        submitAuth("signup").catch((error) => {
          authMessage.textContent = `注册失败：${error.message}`;
          signInButton.disabled = false;
          signUpButton.disabled = false;
        });
      });
      document.querySelector("#sign-out-button").addEventListener("click", async () => {
        const { error } = await supabase.auth.signOut();
        if (error) messageElement.textContent = `退出失败：${error.message}`;
        else showSignedOut();
      });
      exportBackupButton.addEventListener("click", exportBackup);
      importBackupButton.addEventListener("click", () => backupFileInput.click());
      backupFileInput.addEventListener("change", (event) => {
        const [file] = event.target.files;
        if (file) restoreBackup(file);
      });

      if (!supabase) {
        signInButton.disabled = true;
        signUpButton.disabled = true;
        authMessage.textContent = isConfigured
          ? "Supabase 客户端加载失败，请检查网络后刷新页面。"
          : "页面已准备好云端保存；在 supabase-config.js 填入公开 anon/publishable key 并发布后即可注册登录。";
      } else {
        supabase.auth.onAuthStateChange((event, session) => {
          if (event === "PASSWORD_RECOVERY") {
            recoveredUser = session.user;
            setTimeout(showPasswordReset, 0);
          } else if (session && !recoveryMode) {
            setTimeout(() => loadCloudData(session.user), 0);
          } else if (event === "SIGNED_OUT") {
            showSignedOut();
          }
        });
        supabase.auth.getSession().then(({ data, error }) => {
          if (error) showSignedOut(`登录状态读取失败：${error.message}`);
          else if (data.session && recoveryMode) {
            recoveredUser = data.session.user;
            showPasswordReset();
          } else if (data.session) loadCloudData(data.session.user);
        }).catch((error) => showSignedOut(`登录状态读取失败：${error.message}`));
      }

      [startInput, endInput, mealInput].forEach((input) => input.addEventListener("input", updatePreview));
      cancelEditButton.addEventListener("click", () => {
        clearEditing();
        messageElement.textContent = "";
      });
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        messageElement.textContent = "";
        if (!dateInput.value || !startInput.value || !endInput.value) {
          messageElement.textContent = "请填写工作日期、上班时间和下班时间。";
          return;
        }
        const gross = shiftMinutes(startInput.value, endInput.value, false);
        if (gross === 0) {
          messageElement.textContent = "上下班时间不能相同，请检查填写是否正确。";
          return;
        }
        const minutes = Math.max(0, gross - (mealInput.checked ? 30 : 0));
        const existing = records.some((record) => record.date === dateInput.value && record.date !== editingDate);
        if (existing && !window.confirm("这一天已有记录，保存后会替换原记录。要继续吗？")) return;
        const nextRecords = records.filter((record) => record.date !== dateInput.value && record.date !== editingDate);
        nextRecords.push({ date: dateInput.value, start: startInput.value, end: endInput.value, meal: mealInput.checked, minutes });
        if (!await saveRecords(nextRecords)) return;
        clearEditing();
      });

      [settlementStartDateInput, settlementEndDateInput].forEach((input) => {
        input.addEventListener("input", () => {
          settlementRangeManuallyChanged = true;
          updateSettlementSelection();
        });
      });

      settleButton.addEventListener("click", async () => {
        const selectedRecords = updateSettlementSelection();
        if (selectedRecords.length === 0) return;
        const periodStart = settlementStartDateInput.value;
        const periodEnd = settlementEndDateInput.value;
        const remainingRecords = records.filter((record) => record.date < periodStart || record.date > periodEnd);
        const totalMinutes = selectedRecords.reduce((sum, record) => sum + record.minutes, 0);
        const totalPay = (totalMinutes / 60 * HOURLY_RATE).toFixed(2);
        const periodLabel = periodStart === periodEnd
          ? formatDate(periodStart)
          : `${formatDate(periodStart)}至${formatDate(periodEnd)}`;
        if (!window.confirm(`确认结算 ${periodLabel} 的 ${selectedRecords.length} 天记录，合计 ${formatDuration(totalMinutes)}、工资 ¥${totalPay}？\n所选范围外的 ${remainingRecords.length} 条记录会保留在当前累计中。`)) return;
        const settlement = {
          settledAt: localDateString(new Date()),
          periodStart,
          periodEnd,
          minutes: totalMinutes,
          records: selectedRecords
        };
        if (await saveRecords(remainingRecords, [settlement, ...settlements])) {
          settlementRangeManuallyChanged = false;
          setDefaultSettlementRange();
          updateSettlementSelection();
          document.querySelector(".settlement-history").open = true;
          messageElement.textContent = `已结算所选周期；${remainingRecords.length ? `另有 ${remainingRecords.length} 条记录保留在当前累计中。` : "当前记录已全部结算。"}`;
        }
      });

      function openBackgroundDb() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(BACKGROUND_DB, 1);
          request.onupgradeneeded = () => request.result.createObjectStore("settings");
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error || new Error("无法打开背景图片存储。"));
        });
      }

      async function setBackground(blob) {
        const db = await openBackgroundDb();
        await new Promise((resolve, reject) => {
          const transaction = db.transaction("settings", "readwrite");
          transaction.objectStore("settings").put(blob, "background");
          transaction.oncomplete = resolve;
          transaction.onerror = () => reject(transaction.error || new Error("无法保存背景图片。"));
          transaction.onabort = () => reject(transaction.error || new Error("背景图片保存已取消。"));
        });
        db.close();
        applyBackground(blob);
      }

      function closeSettingsMenu() {
        document.querySelector("#background-menu").hidden = true;
        document.querySelector("#menu-trigger").setAttribute("aria-expanded", "false");
      }

      document.querySelector("#menu-trigger").addEventListener("click", () => {
        const menu = document.querySelector("#background-menu");
        menu.hidden = !menu.hidden;
        document.querySelector("#menu-trigger").setAttribute("aria-expanded", String(!menu.hidden));
      });

      document.addEventListener("click", (event) => {
        if (!event.target.closest(".settings-menu")) closeSettingsMenu();
        if (!event.target.closest(".record-actions")) {
          recordsElement.querySelectorAll(".record-menu").forEach((menu) => { menu.hidden = true; });
          recordsElement.querySelectorAll(".record-menu-trigger").forEach((trigger) => trigger.setAttribute("aria-expanded", "false"));
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeSettingsMenu();
          recordsElement.querySelectorAll(".record-menu").forEach((menu) => { menu.hidden = true; });
          recordsElement.querySelectorAll(".record-menu-trigger").forEach((trigger) => trigger.setAttribute("aria-expanded", "false"));
        }
      });

      function applyBackground(blob) {
        if (!blob) return;
        const imageUrl = URL.createObjectURL(blob);
        document.body.style.setProperty("--custom-background", `url("${imageUrl}")`);
        document.body.classList.add("has-background");
        document.querySelector("#reset-background").hidden = false;
      }

      async function loadBackground() {
        try {
          const db = await openBackgroundDb();
          const request = db.transaction("settings", "readonly").objectStore("settings").get("background");
          request.onsuccess = () => { applyBackground(request.result); db.close(); };
          request.onerror = () => { db.close(); messageElement.textContent = "读取自定义背景失败。"; };
        } catch (error) {
          messageElement.textContent = `读取自定义背景失败：${error.message}`;
        }
      }

      document.querySelector("#background-file").addEventListener("change", async (event) => {
        const file = event.target.files[0];
        if (!file) return;
        if (!file.type.startsWith("image/")) {
          messageElement.textContent = "请选择图片文件作为背景。";
          event.target.value = "";
          return;
        }
        try {
          await setBackground(file);
          messageElement.textContent = "";
          closeSettingsMenu();
        } catch (error) {
          messageElement.textContent = `更换背景失败：${error.message}`;
        }
        event.target.value = "";
      });

      document.querySelector("#reset-background").addEventListener("click", async () => {
        try {
          const db = await openBackgroundDb();
          await new Promise((resolve, reject) => {
            const transaction = db.transaction("settings", "readwrite");
            transaction.objectStore("settings").delete("background");
            transaction.oncomplete = resolve;
            transaction.onerror = () => reject(transaction.error || new Error("无法删除背景图片。"));
          });
          db.close();
          document.body.classList.remove("has-background");
          document.body.style.removeProperty("--custom-background");
          document.querySelector("#reset-background").hidden = true;
          messageElement.textContent = "";
          closeSettingsMenu();
        } catch (error) {
          messageElement.textContent = `恢复默认背景失败：${error.message}`;
        }
      });

      render();
      updatePreview();
      loadBackground();
    })();
  </script>
</body>
</html>
